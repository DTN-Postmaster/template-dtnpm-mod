[graph]
targets = [
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive crates with no safe upgrade available yet (via regorus / dtnpm-core):
    "RUSTSEC-2026-0542", # humantime
    "RUSTSEC-2026-0543", # chrono
    "RUSTSEC-2026-0555", # chrono-tz
    # VEX / Not Affected: RUSTSEC-2026-0459 (libsqlite3-sys CVE-2026-119375)
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
