name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Security & Quality Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905fa189e4c376166672c3f2f2378f6 # v2.11.0
        with:
          egress-policy: audit

      - name: Check out hardy dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dtn-postmaster/hardy
          path: hardy

      - name: Check out dtnpm-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtnpm-core

      - name: Check out dtnpm-web-core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtnpm-web-core

      - name: Check out template-dtnpm-mod
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: template-dtnpm-mod

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a54c7fe9363c9033d2732239706823852d433fa3 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install security analysis tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run strict security check
        run: |
          cd template-dtnpm-mod
          ./scripts/check-security.sh --strict

      - name: Run unit and integration tests
        run: |
          cd template-dtnpm-mod
          cargo test --workspace --all-targets -- -D warnings
