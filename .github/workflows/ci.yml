name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Security & Quality Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Check out hardy dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm

      - name: Check out dtnpm-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core

      - name: Check out dtnpm-web-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core

      - name: Check out template-dtnpm-mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dtn-postmaster/template-dtnpm-mod

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"

      - name: Install security analysis tools
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tool: cargo-audit, cargo-deny
      - name: Cache gitleaks
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/gitleaks
          key: gitleaks-8.30.1-linux-x64
      - name: Install gitleaks (cache miss)
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/gitleaks"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/gitleaks" gitleaks
      - name: Add gitleaks to PATH
        run: echo "$HOME/.local/gitleaks" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install UI dependencies (for audit)
        working-directory: dtn-postmaster/template-dtnpm-mod/ui
        run: pnpm install --frozen-lockfile

      - name: Run strict security check
        run: |
          cd dtn-postmaster/template-dtnpm-mod
          ./scripts/check-security.sh --strict

      - name: Run unit and integration tests
        run: |
          cd dtn-postmaster/template-dtnpm-mod
          cargo test --workspace --all-targets
