name: Security & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Security & Quality Verification
    runs-on: ubuntu-24.04

    steps:
      - name: Check out hardy dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm

      - name: Check out dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core

      - name: Check out dtnpm-web-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core

      - name: Check out template-dtnpm-mod
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/template-dtnpm-mod

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install security analysis tools
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit, cargo-deny, gitleaks

      - name: Run strict security check
        run: |
          cd dtn-postmaster/template-dtnpm-mod
          ./scripts/check-security.sh --strict

      - name: Run unit and integration tests
        run: |
          cd dtn-postmaster/template-dtnpm-mod
          cargo test --workspace --all-targets
